name: Provider and native runtime acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/provider-runtime.yml'
      - 'internal/**'
      - 'scripts/acceptance/**'
      - 'scripts/test_published_writer.sh'
      - 'scripts/test_history_published_compatibility.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-runtime:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'codex/backfill-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Record exact candidate and native runtime
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance-evidence"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(id -u)" != 0
          test "$(go env GOOS)" = "$EXPECTED_GOOS"
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
          test "$(go env GOHOSTOS)" = "$EXPECTED_GOOS"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_GOARCH"
          id -u > "$RUNNER_TEMP/acceptance-evidence/euid.txt"
          go version | grep -q ' go1\.27\.1 '
          git rev-parse HEAD > "$RUNNER_TEMP/acceptance-evidence/candidate.txt"
          uname -srm > "$RUNNER_TEMP/acceptance-evidence/native-platform.txt"
          go version >> "$RUNNER_TEMP/acceptance-evidence/native-platform.txt"
          git --version >> "$RUNNER_TEMP/acceptance-evidence/native-platform.txt"
          if [ "$(uname -s)" = Darwin ]; then sw_vers >> "$RUNNER_TEMP/acceptance-evidence/native-platform.txt"; else cat /etc/os-release >> "$RUNNER_TEMP/acceptance-evidence/native-platform.txt"; fi
      - name: Execute native lifecycle components (not cross compilation)
        env:
          GOMAXPROCS: '2'
          GOCACHE: ${{ runner.temp }}/native-runtime-go-cache
        run: |
          go test -json -race -p 2 -count=1 -timeout=12m -run '^(TestAdmissionPinnedLiveCopyCoherentAcrossExternalGrowth|TestAdmissionReadOnlyLiveCopyLeavesAllNativeBytes|TestDurableLiveCursorAdmissionPublishesAfterSourceDeletion|TestPrivacyOriginalJournalSurvivesRestartUntilLocalSuccessor|TestPrivacyOriginalJournalSurvivesFailedLocalCommit|TestPrivacyUncommittedReductionRefiltersOldestContentOnPolicyIncrease|TestStagedUncommittedReductionRefiltersImmutableContentOnPolicyIncrease|TestPrivacyPolicyChangeAfterOriginalCleanupUsesCommittedSource|TestRetainedPrivacyTransformsEveryRevisionWithoutNativeAndPreservesAge|TestAdmissionStagePublishesAfterDeletionAndPreservesNewerRequest|TestGenerationRecoverySettlesStageAndClearsOnlySuccessorLinkage|TestOrdinaryCollectorPassDoesNotCreateValidationSlice|TestValidationSlicesShareSweepsAtNativeStoreScale|TestPublishedCacheStoresTheBundleOnce|TestFrozenGenerationsCostNothingPerPass)$' ./internal/cursorstore ./internal/backfill ./internal/collector ./internal/state ./internal/rolloutcatalog > "$RUNNER_TEMP/acceptance-evidence/native-tests.jsonl"
          python3 scripts/acceptance/provider/verify-results.py "$RUNNER_TEMP/acceptance-evidence/native-tests.jsonl" TestAdmissionPinnedLiveCopyCoherentAcrossExternalGrowth TestAdmissionReadOnlyLiveCopyLeavesAllNativeBytes TestDurableLiveCursorAdmissionPublishesAfterSourceDeletion TestPrivacyOriginalJournalSurvivesRestartUntilLocalSuccessor TestPrivacyOriginalJournalSurvivesFailedLocalCommit TestPrivacyUncommittedReductionRefiltersOldestContentOnPolicyIncrease TestStagedUncommittedReductionRefiltersImmutableContentOnPolicyIncrease TestPrivacyPolicyChangeAfterOriginalCleanupUsesCommittedSource TestRetainedPrivacyTransformsEveryRevisionWithoutNativeAndPreservesAge TestAdmissionStagePublishesAfterDeletionAndPreservesNewerRequest TestGenerationRecoverySettlesStageAndClearsOnlySuccessorLinkage TestOrdinaryCollectorPassDoesNotCreateValidationSlice TestValidationSlicesShareSweepsAtNativeStoreScale TestPublishedCacheStoresTheBundleOnce TestFrozenGenerationsCostNothingPerPass > "$RUNNER_TEMP/acceptance-evidence/native-summary.json"
      - name: Execute published Darwin compatibility assets
        if: runner.os == 'macOS'
        env:
          AA_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/acceptance-evidence
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
          GOCACHE: ${{ runner.temp }}/native-runtime-go-cache
        run: bash scripts/acceptance/provider/published-assets.sh > "$RUNNER_TEMP/acceptance-evidence/published-writers.txt" 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-runtime-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/acceptance-evidence/
          retention-days: 14

  disposable-provider:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'codex/backfill-')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Record exact provider candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          go version | grep -q ' go1\.27\.1 '
          mkdir -p "$RUNNER_TEMP/acceptance-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/acceptance-evidence/candidate.txt"
          uname -srm > "$RUNNER_TEMP/acceptance-evidence/native-platform.txt"
          go version >> "$RUNNER_TEMP/acceptance-evidence/native-platform.txt"
          cat /etc/os-release >> "$RUNNER_TEMP/acceptance-evidence/native-platform.txt"
          test "$(id -u)" != 0
          id -u > "$RUNNER_TEMP/acceptance-evidence/euid.txt"
          docker version --format '{{.Server.Version}}' >> "$RUNNER_TEMP/acceptance-evidence/native-platform.txt"
      - name: Execute actual disposable S3-compatible provider
        timeout-minutes: 25
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
          GOCACHE: ${{ runner.temp }}/provider-runtime-go-cache
          AA_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/acceptance-evidence
        run: bash scripts/acceptance/provider/host.sh
      - name: Retry cleanup of only this run's disposable resources
        if: always()
        run: bash scripts/acceptance/provider/cleanup.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: disposable-provider-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/acceptance-evidence/
          retention-days: 14
