name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Every action is pinned to a full commit SHA (a tag can be moved); the
# comment names the release it is. Dependabot proposes updates.
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    # The job takes 7 to 11 minutes. A hung step is stopped here, not after
    # GitHub's default of six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go version is pinned here rather than read from go.mod, so CI
      # never depends on how setup-go picks a toolchain. It must match
      # go.mod's toolchain line; the next step checks that.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Require Go 1.27.1 (go.mod's toolchain line)
        run: |
          go version
          go version | grep -q ' go1\.27\.1 ' || { echo "expected go1.27.1, matching go.mod's toolchain line" >&2; exit 1; }
      # internal/cli takes 275 to 427 seconds under the race detector on these
      # runners, too close to go test's default of 10 minutes a package.
      - run: go test -race -timeout 20m ./...
      # The run above uses the race detector, under which the wall-clock
      # assertions of the performance tests are skipped (the detector slows
      # filtering by an order of magnitude). This plain run makes them count,
      # at their documented size. See dev/contributing/testing.md.
      - name: Performance assertions (no race detector)
        run: go test -v -p 1 -count=1 -run 'StayFast|FiveMegabyte|TestCursorOverlappingHooksRegisterOnce' ./internal/collector ./internal/archive ./internal/capture
        env:
          AGENT_ARCHIVE_PERF: '1'
      - run: go vet ./...
      - run: python3 scripts/test_release_signing.py
      - run: python3 scripts/test_release_assets.py
      - run: python3 scripts/test_install.py
      - run: python3 scripts/test_install_from_source.py
      - run: python3 scripts/test_purge_recipe.py
      # Static and fake-Docker checks of the Linux live acceptance scripts;
      # the live run itself needs privileged Docker and is not run in CI.
      - run: python3 scripts/test_linux_acceptance.py

  cross-build:
    # What the two platform legs above cannot see: the ubuntu leg builds only
    # linux/amd64, and the macOS leg builds only darwin with cgo (the release
    # configuration). This job, on Linux, builds and vets the other targets,
    # so a change that breaks one fails here, not on release day. The macOS
    # legs and the lint job already vet darwin with cgo natively, which no
    # Linux runner can do (cgo needs Apple's SDK).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Require Go 1.27.1 (go.mod's toolchain line)
        run: |
          go version
          go version | grep -q ' go1\.27\.1 ' || { echo "expected go1.27.1, matching go.mod's toolchain line" >&2; exit 1; }
      - name: Build and vet linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build ./...
          go vet ./...
      # A macOS build without cgo uses the Keychain stand-in in
      # internal/credentials/keychain_nocgo_darwin.go, which the macOS legs
      # (cgo on) never compile.
      - name: Vet darwin without cgo
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go vet ./...
      # The release workflow's Linux build and checks, on a placeholder
      # version, so everything except tagging and publishing is exercised
      # before a release.
      - name: Build and check the release's Linux binaries
        env:
          VERSION: v0.0.0-ci
        run: |
          ./scripts/build-release.sh linux
          ./scripts/verify-linux-release.sh

  fuzz:
    # Every parser, redaction, and hook fuzz target, briefly, so a change that
    # breaks one of their properties fails before merge
    # (dev/contributing/testing.md). The failure message quotes the input;
    # reproduce it locally and keep it as a seed.
    runs-on: ubuntu-latest
    # At 30 seconds a target, the targets take about 12 minutes in all.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Fuzz each target for 30 seconds
        run: |
          found=0
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              found=$((found + 1))
              echo "::group::$pkg $target"
              go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime 30s -fuzzminimizetime 2s
              echo "::endgroup::"
            done
          done
          # Guard against a listing that silently finds nothing: internal/archive
          # has ten targets, internal/hooks two, and internal/cli one.
          test "$found" -ge 13

  real-systemd:
    # The systemd scheduler adapter against a real systemd user manager
    # (dev/contributing/testing.md): ubuntu-latest is a virtual machine with
    # systemd, where lingering starts the runner user's own manager. It runs
    # the scheduler conformance suite over that manager (the states the suite
    # puts a job in are real ones) and a setup-level smoke: the real setup
    # installs the collector, the manager's timer starts its program, and
    # uninstall leaves nothing. The tests change the user manager's units, so
    # they run only when AGENT_ARCHIVE_REAL_SYSTEMD=1, and refuse a machine
    # that already has agent-archive units.
    #
    # It depends on the runner image (logind, the user bus, a minute of timer)
    # and so is not meant to block a merge on its own: it is a check of its own
    # that is not among the branch's required ones, bounded by timeout-minutes.
    # A failure is real information about the adapter, never to be ignored, but a
    # broken runner image should not stop unrelated pull requests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Require Go 1.27.1 (go.mod's toolchain line)
        run: |
          go version
          go version | grep -q ' go1\.27\.1 ' || { echo "expected go1.27.1, matching go.mod's toolchain line" >&2; exit 1; }
      # The runner user has no login session, so no user manager: lingering
      # starts one at once (user@UID.service) and keeps it running. Every later
      # step finds it through these two variables, as a login shell would.
      - name: Start the runner user's systemd user manager
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 60); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 0.5
          done
          test -S "/run/user/$uid/bus" || { echo "no user bus at /run/user/$uid/bus after enabling lingering" >&2; exit 1; }
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus"
          systemctl --version | head -n 1
          systemctl --user show-environment > /dev/null
          loginctl show-user "$uid" --property=Linger
      - name: Scheduler conformance suite against the real user manager
        env:
          AGENT_ARCHIVE_REAL_SYSTEMD: '1'
        run: go test -count=1 -v -run 'TestReal' ./internal/scheduler/systemd
      # The timer's first run comes a minute after the user manager started
      # (OnBootSec=60s), so this waits up to two and a half minutes for it.
      # It also runs uninstall --skip-scheduler with the manager out of reach,
      # then the command it prints for stopping the job by hand.
      - name: Setup, the timer's first run, and uninstall
        env:
          AGENT_ARCHIVE_REAL_SYSTEMD: '1'
        run: go test -count=1 -v -timeout 8m -run 'TestRealSystemd' ./internal/cli
      - name: What the manager says, if a step failed
        if: failure()
        run: |
          systemctl --user list-units --all --no-pager 'agent-archive*' || true
          systemctl --user status --no-pager 'agent-archive*' || true
          journalctl --user --no-pager -n 100 || true

  lint:
    # macOS, the platform the tool ships for, so the cgo Keychain code is
    # linted too.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --new-from-merge-base below needs the base branch's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      # Built with this job's Go (install-mode: goinstall) rather than
      # downloaded prebuilt, so it always understands go.mod's Go version.
      # Keep the version in step with the comment in .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --disable=revive
      # Production code only tests reach belongs in a _test.go file (or a
      # test-only package); deadcode finds it. It analyses one build at a
      # time, so it runs twice: for macOS, and for Linux (GOOS=linux with cgo
      # off, the release configuration). The files with a !darwin build
      # constraint (internal/credentials/keychain_stub.go,
      # internal/backfill/birthtime_other.go,
      # internal/cursorstore/owner_other.go) are what ships on Linux, and the
      # macOS run never sees them; nor will it see future Linux-only files.
      # The Linux run reports one function the macOS run does not, because
      # only the macOS Keychain code calls it: credentials.errorForOSStatus
      # (EncodeSecret and DecodeSecret gained a Linux caller with the file
      # store). It has its own exception below; remove it when a Linux caller
      # appears. deadcode is built once
      # and run as a binary, since `go run` would try to execute a tool
      # cross-built for GOOS=linux.
      # Listed exceptions: the test helper packages, a cgo probe (test files
      # cannot use cgo), a load counter other packages' cost tests read, the
      # redacting String methods of cloudflare.S3Credentials (only fmt calls
      # them, and only if someone formats the key), and
      # the terminal UI layer in internal/cli/ui.go, whose parts the
      # onboarding screens adopt one PR at a time (they are listed by name:
      # remove each as it gains a caller, and the exception once none is left).
      - name: No unreachable production code
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/tools/cmd/deadcode@v0.50.0
          shared='^internal/(state/statetest|storage/storagetest|cloudflare/cloudflaretest|testutil)/|^internal/credentials/keychain_darwin\.go:[0-9]+:[0-9]+: unreachable func: lookupForbidsUI$|^internal/state/published\.go:[0-9]+:[0-9]+: unreachable func: PublishedStateLoads$|^internal/cli/ui\.go:[0-9]+:[0-9]+: unreachable func: (textStyle\.(spin|spinEvery)|spinner\.stop)$|^internal/cloudflare/r2\.go:[0-9]+:[0-9]+: unreachable func: S3Credentials\.(String|GoString)$'
          linux_only='|^internal/credentials/keychain_errors\.go:[0-9]+:[0-9]+: unreachable func: errorForOSStatus$'
          # check LABEL EXCEPTIONS: deadcode's output for the current
          # GOOS/CGO_ENABLED, minus the exceptions, must be empty.
          check() {
            "$RUNNER_TEMP/bin/deadcode" ./... > "$RUNNER_TEMP/deadcode-$1.txt"
            # grep exits 1 when every line is an exception; 2 is a real failure.
            status=0
            grep -v -E "$2" "$RUNNER_TEMP/deadcode-$1.txt" > "$RUNNER_TEMP/unexpected-$1.txt" || status=$?
            if [ "$status" -gt 1 ]; then
              exit "$status"
            fi
            if [ -s "$RUNNER_TEMP/unexpected-$1.txt" ]; then
              echo "Unreachable production code in the $1 build:" >&2
              cat "$RUNNER_TEMP/unexpected-$1.txt"
              echo "Move test-only code to a _test.go file, or delete it." >&2
              exit 1
            fi
          }
          check macos "$shared"
          GOOS=linux CGO_ENABLED=0 check linux "$shared$linux_only"
      # Doc comments are required on exported identifiers that a change adds
      # or touches; existing gaps do not fail the build.
      - name: Doc comments on new exported identifiers
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --enable-only=revive --new-from-merge-base=origin/${{ github.base_ref }}
