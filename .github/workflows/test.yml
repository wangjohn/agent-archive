name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Every action is pinned to a full commit SHA (a tag can be moved); the
# comment names the release it is. Dependabot proposes updates.
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # setup-go@v5 reads only go.mod's `go` line, not its `toolchain` line,
      # so the version is set here. It must match go.mod's toolchain line.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Require Go 1.27.1 (go.mod's toolchain line)
        run: |
          go version
          go version | grep -q ' go1\.27\.1 ' || { echo "expected go1.27.1, matching go.mod's toolchain line" >&2; exit 1; }
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 scripts/test_release_signing.py
      - run: python3 scripts/test_install.py

  lint:
    # macOS, the platform the tool ships for, so the cgo Keychain code is
    # linted too.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # --new-from-merge-base below needs the base branch's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      # Built with this job's Go (install-mode: goinstall) rather than
      # downloaded prebuilt, so it always understands go.mod's Go version.
      # Keep the version in step with the comment in .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --disable=revive
      # Doc comments are required on exported identifiers that a change adds
      # or touches; existing gaps do not fail the build.
      - name: Doc comments on new exported identifiers
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --enable-only=revive --new-from-merge-base=origin/${{ github.base_ref }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      # Reports only vulnerabilities in code this module actually reaches.
      # The Go toolchain's own standard library is checked too, so a Go
      # patch release can fail this job until go.mod's toolchain is bumped.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
