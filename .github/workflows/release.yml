name: Release
on:
  push:
    tags:
      - 'v*.*.*'
# Each job asks for what it needs. Only the publish job can write to the
# repository, and only it can see the Apple signing secrets, which live in
# the protected `release` environment.
#
# Three jobs: `build` (macOS binaries), `build-linux` (Linux binaries), and
# `publish`, which signs the macOS binaries and publishes all four. The Linux
# binaries are not signed: trust in them rests on SHA256SUMS and the build
# provenance attestation. The two build jobs repeat the tag and toolchain
# guards on purpose, so neither can build from an untagged or off-main commit;
# keep them in step.
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # The macOS binaries. Both Intel and ARM64 are cross-compiled from one macOS
    # runner: real Keychain access requires CGO_ENABLED=1 (see
    # internal/credentials/keychain_darwin.go), and Xcode's clang, already
    # present on GitHub's macOS runners, cross-compiles cgo for both
    # architectures without a separate machine per arch.
    runs-on: macos-14
    permissions:
      contents: read
    env:
      # The tag, passed to scripts through the environment and never
      # expanded into a script's text.
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tag can be checked against main.
          fetch-depth: 0
          persist-credentials: false

      - name: Require a vX.Y.Z tag on a commit in main
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must be vX.Y.Z; got a tag that is not"
            exit 1
          fi
          # fetch-depth 0 fetched every branch, so origin/main is main as of
          # this run.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main; tag a commit that has been merged"
            exit 1
          fi

      # The Go version is pinned here rather than read from go.mod, so CI
      # never depends on how setup-go picks a toolchain. It must match
      # go.mod's toolchain line; the next step checks that.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          # No module cache: a release builds signed binaries, and a cache
          # restored from another workflow run could poison them.
          cache: false
      - name: Require Go 1.27.1 (go.mod's toolchain line)
        run: |
          go version
          go version | grep -q ' go1\.27\.1 ' || { echo "expected go1.27.1, matching go.mod's toolchain line" >&2; exit 1; }

      # The same gate as a pull request's test job: nothing is built for
      # release from a commit whose tests fail on this runner.
      - name: Test
        run: |
          go vet ./...
          go test -race -timeout 20m ./...   # as test.yml, for internal/cli
          python3 scripts/test_release_signing.py
          python3 scripts/test_release_assets.py
          python3 scripts/test_install.py
          python3 scripts/test_purge_recipe.py

      - name: Build
        run: ./scripts/build-release.sh darwin

      - name: Verify build reports the release version
        run: |
          # A build error here would otherwise only surface once a user runs
          # `--version` on an already-published binary. The arm64 binary
          # runs natively on this runner; the amd64 one is cross-compiled,
          # so its embedded version string is checked instead of executing
          # it under Rosetta, which this runner may not have installed.
          got="$(./dist/agent-archive-darwin-arm64 --version 2>&1 || true)"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::agent-archive --version (arm64) reported '$got', expected '$VERSION'"
            exit 1
          fi
          if ! strings dist/agent-archive-darwin-amd64 | grep -qxF "$VERSION"; then
            echo "::error::agent-archive-darwin-amd64 does not embed version '$VERSION'"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned
          path: |
            dist/agent-archive-darwin-amd64
            dist/agent-archive-darwin-arm64
          if-no-files-found: error
          retention-days: 1

  build-linux:
    # The Linux binaries (x86-64 and ARM64): pure Go with CGO_ENABLED=0, so
    # both cross-compile on one Linux runner with no C toolchain, and the
    # x86-64 one runs natively here for the version check.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same guard as the build job's.
      - name: Require a vX.Y.Z tag on a commit in main
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must be vX.Y.Z; got a tag that is not"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main; tag a commit that has been merged"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          # No module cache, as in the build job.
          cache: false
      - name: Require Go 1.27.1 (go.mod's toolchain line)
        run: |
          go version
          go version | grep -q ' go1\.27\.1 ' || { echo "expected go1.27.1, matching go.mod's toolchain line" >&2; exit 1; }

      # The same gate as a pull request's Linux test job: nothing is built
      # for release from a commit whose tests fail on Linux.
      - name: Test
        run: |
          go vet ./...
          go test -race -timeout 20m ./...   # as test.yml, for internal/cli
          python3 scripts/test_release_signing.py
          python3 scripts/test_release_assets.py
          python3 scripts/test_install.py
          python3 scripts/test_purge_recipe.py

      - name: Build
        run: ./scripts/build-release.sh linux

      # Static linking, the x86-64 binary's version run natively, and the
      # ARM64 binary's embedded version string (it cannot run on this
      # runner). The same script the Test workflow runs on every pull request.
      - name: Verify build reports the release version
        run: ./scripts/verify-linux-release.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: |
            dist/agent-archive-linux-amd64
            dist/agent-archive-linux-arm64
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, build-linux]
    runs-on: macos-14
    # Holds the Apple secrets. Configure it with required reviewers so a
    # pushed tag cannot sign and publish on its own.
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # build provenance attestation
      attestations: write # build provenance attestation
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require release signing configuration
        env:
          APPLE_SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/check-release-signing.sh

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned
          path: dist

      # Unsigned by design (the Codesign and Notarize steps below name only
      # the macOS binaries); see the build-linux job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux
          path: dist

      - name: Import signing certificate
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          keychain="release-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"

          cert_path="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"
          security import "$cert_path" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert_path"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Codesign
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The same Developer ID requirement install.sh checks, so a
          # release that install.sh would refuse is never published.
          requirement="anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\""
          for binary in dist/agent-archive-darwin-amd64 dist/agent-archive-darwin-arm64; do
            chmod 755 "$binary"
            # The Keychain trusts a binary by identifier and team, so an
            # "Always Allow" given to one release holds for the next only
            # while this identifier stays the same. It is pinned here, not
            # left to codesign, and scripts/local-signing.sh signs opted-in
            # development builds with it too.
            identifier="$(basename "$binary")"
            codesign --force --options runtime --timestamp \
              --identifier "$identifier" --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            codesign --verify --strict --verbose "$binary"
            codesign --verify --strict -R="identifier \"${identifier}\" and ${requirement}" "$binary"
          done

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Apple's notary service only accepts zip/dmg/pkg submissions, even
          # for a bare executable; the shipped artifact stays the raw signed
          # binary, since `stapler` only attaches tickets to a bundle format
          # notarytool can staple — Gatekeeper resolves an unstapled binary's
          # ticket online on first launch instead.
          for arch in amd64 arm64; do
            binary="dist/agent-archive-darwin-${arch}"
            zip -j "$RUNNER_TEMP/notarize-${arch}.zip" "$binary"
            xcrun notarytool submit "$RUNNER_TEMP/notarize-${arch}.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary-${arch}.json"
            python3 -c 'import json,sys; result=json.load(open(sys.argv[1])); sys.exit(0 if result.get("status") == "Accepted" else "Notarization was not accepted")' "$RUNNER_TEMP/notary-${arch}.json"
          done

      - name: Clean up signing keychain
        if: ${{ always() && steps.signing.outcome == 'success' }}
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true

      # Lists all four binaries, the macOS ones as signed. The Linux ones are
      # exactly the bytes build-linux built.
      - name: Recompute checksums after signing
        run: ./scripts/write-checksums.sh dist

      # Records, signed by GitHub, that these exact bytes came from this
      # workflow run at this commit. Check one with:
      #   gh attestation verify agent-archive-darwin-arm64 --repo wangjohn/agent-archive
      # The subjects are exactly the released binaries, the upload-artifact
      # and `gh release create` lists below (scripts/test_release_assets.py
      # checks that the three agree).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/agent-archive-darwin-amd64
            dist/agent-archive-darwin-arm64
            dist/agent-archive-linux-amd64
            dist/agent-archive-linux-arm64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-archive-${{ github.ref_name }}
          path: |
            dist/agent-archive-darwin-amd64
            dist/agent-archive-darwin-arm64
            dist/agent-archive-linux-amd64
            dist/agent-archive-linux-arm64
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "agent-archive $VERSION" \
            --notes "See CHANGELOG.md for what changed, docs/getting-started/install.md for installation, and SHA256SUMS below for checksums. Verify a binary's build provenance with: gh attestation verify <file> --repo $GITHUB_REPOSITORY" \
            dist/agent-archive-darwin-amd64 \
            dist/agent-archive-darwin-arm64 \
            dist/agent-archive-linux-amd64 \
            dist/agent-archive-linux-arm64 \
            dist/SHA256SUMS
