name: Feature request
description: Suggest a new capability or a change to how agent-archive works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Rough ideas are fine.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Would this upload anything that isn't uploaded today, or keep anything new on disk? If so, what?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
