name: Bug report
description: agent-archive did something wrong, crashed, or printed an error.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste transcript content, bucket names you'd rather keep private, access keys, or anything from your Keychain or credentials file. For a security problem (for example, a secret that got past redaction), don't open an issue: follow SECURITY.md, or use the **Security contact request** template if private reporting isn't available.
        If a session wasn't archived or its counts look wrong, use the **Capture gap** template.
  - type: input
    id: version
    attributes:
      label: agent-archive version
      description: Output of `agent-archive --version`. A source build prints `dev-<commit>`; if yours prints only `dev`, add the commit (`git rev-parse --short HEAD` in your checkout).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: On Linux, add the distribution and the output of `systemctl --version`.
      placeholder: "e.g. macOS 15.5 (Apple silicon), or Ubuntu 24.04 (arm64), systemd 255"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what it printed. Redact paths or names you'd rather not share.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: As far as you can tell.
  - type: textarea
    id: status
    attributes:
      label: "`agent-archive status` output (optional)"
      description: Redact bucket names, paths, and anything else you'd rather keep private.
      render: text
